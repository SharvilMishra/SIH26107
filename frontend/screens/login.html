<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - ManakAI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: "#000666",
          secondary: "#2b5bb5",
          "on-primary": "#ffffff",
          background: "#f8f9fa",
          "surface-container-lowest": "#ffffff",
          "border-subtle": "#E0E0E0",
          "on-surface-variant": "#454652",
          "alert-red": "#C62828",
        },
      },
    },
  };
</script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-6 font-sans">
<div class="w-full max-w-md bg-surface-container-lowest border border-border-subtle rounded-xl shadow-sm p-8">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-primary">ManakAI</h1>
<p class="text-on-surface-variant text-sm mt-1">Sign in to your account</p>
</div>

<div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-alert-red/10 border border-alert-red/30 text-alert-red text-sm"></div>

<form id="login-form" class="flex flex-col gap-4">
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-1" for="login-email">Email</label>
<input class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" id="login-email" required type="email">
</div>
<div>
<label class="block text-sm font-medium text-on-surface-variant mb-1" for="login-password">Password</label>
<input class="w-full h-11 px-4 border border-border-subtle rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" id="login-password" required type="password">
</div>
<button class="h-11 bg-primary text-on-primary rounded-lg font-semibold hover:opacity-90 transition-opacity flex items-center justify-center gap-2" id="login-submit" type="submit">
<span>Sign In</span>
</button>
</form>

<div class="flex items-center gap-3 my-6">
<div class="flex-1 h-px bg-border-subtle"></div>
<span class="text-xs text-on-surface-variant uppercase">or</span>
<div class="flex-1 h-px bg-border-subtle"></div>
</div>

<button class="w-full h-11 border border-border-subtle rounded-lg font-medium flex items-center justify-center gap-3 hover:bg-background transition-colors" id="google-signin-btn" type="button">
<svg height="18" viewBox="0 0 18 18" width="18"><path d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z" fill="#4285F4"></path><path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z" fill="#34A853"></path><path d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.33z" fill="#FBBC05"></path><path d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z" fill="#EA4335"></path></svg>
<span>Continue with Google</span>
</button>

<p class="text-center text-sm text-on-surface-variant mt-6">
Don't have an account? <a class="text-secondary font-medium hover:underline" href="signup.html">Sign up</a>
</p>
</div>

<script src="../js/firebase-config.js" type="module"></script>
<script src="../js/auth.js" type="module"></script>
<script type="module">
  import { signInWithEmail, signInWithGoogle } from '../js/auth.js';

  const form = document.querySelector('#login-form');
  const submitBtn = document.querySelector('#login-submit');
  const googleBtn = document.querySelector('#google-signin-btn');
  const errorBox = document.querySelector('#login-error');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove('hidden');
  }

  function clearError() {
    errorBox.classList.add('hidden');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearError();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const email = document.querySelector('#login-email').value.trim();
    const password = document.querySelector('#login-password').value;

    const { user, error } = await signInWithEmail(email, password);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';

    if (error) {
      showError(error);
    } else {
      window.location.href = 'home.html';
    }
  });

  googleBtn.addEventListener('click', async () => {
    clearError();
    googleBtn.disabled = true;

    const { user, error } = await signInWithGoogle();
    googleBtn.disabled = false;

    if (error) {
      showError(error);
    } else {
      window.location.href = 'home.html';
    }
  });
</script>
</body></html>
